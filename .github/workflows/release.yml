# SPDX-License-Identifier: GPL-3.0-or-later
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  linux-build:
    name: Linux bundle (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config curl git unzip xz-utils zip \
            meson libgtk-4-dev libpipewire-0.3-dev libpulse-dev \
            libsecret-1-dev libepoxy-dev libwayland-dev wayland-protocols
      # libgtk4-layer-shell-dev is not in Ubuntu 24.04 (first shipped in 24.10),
      # so build the pinned release from source.
      - name: Build gtk4-layer-shell from source
        run: |
          if pkg-config --exists gtk4-layer-shell-0; then
            echo "gtk4-layer-shell already available"
            exit 0
          fi
          curl -fsSL -o gls.tar.gz https://github.com/wmww/gtk4-layer-shell/archive/refs/tags/v1.3.0.tar.gz
          echo "1ebb01ab14e98afd1727f68f64981c37bd23305b1f131f5667c02b94cf593192  gls.tar.gz" | sha256sum -c -
          tar xzf gls.tar.gz
          meson setup gls-build gtk4-layer-shell-1.3.0 --prefix=/usr/local \
            -Dexamples=false -Ddocs=false -Dtests=false -Dsmoke-tests=false \
            -Dintrospection=false -Dvapi=false
          meson compile -C gls-build
          sudo meson install -C gls-build
          sudo ldconfig
          rm -rf gls.tar.gz gls-build gtk4-layer-shell-1.3.0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Fetch pinned Flutter engine
        run: linux/engine/fetch_engine.sh ${{ matrix.arch == 'x86_64' && 'x64' || matrix.arch }} release
      - name: Build
        env:
          PKG_CONFIG_PATH: /usr/local/lib/pkgconfig:/usr/local/lib/x86_64-linux-gnu/pkgconfig:/usr/local/lib/aarch64-linux-gnu/pkgconfig
          LD_LIBRARY_PATH: /usr/local/lib:/usr/local/lib/x86_64-linux-gnu:/usr/local/lib/aarch64-linux-gnu
        run: flutter build linux --release
      - name: Collect bundle
        run: |
          bundle=$(find build/linux -type d -name bundle -path '*release*' | head -n 1)
          test -n "$bundle" && test -x "$bundle/ramble_voice"
          mkdir -p dist
          cp -a "$bundle" dist/bundle
      - uses: actions/upload-artifact@v4
        with:
          name: linux-bundle-${{ matrix.arch }}
          path: dist/bundle
          if-no-files-found: error

  flatpak:
    name: Flatpak (${{ matrix.arch }})
    needs: linux-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-bundle-${{ matrix.arch }}
          path: packaging/flatpak/bundle
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: ramble-voice-${{ matrix.arch }}.flatpak
          manifest-path: packaging/flatpak/io.github.luohoa97.RambleVoice.yml
          arch: ${{ matrix.arch }}
          cache-key: flatpak-builder-${{ matrix.arch }}-${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-${{ matrix.arch }}
          path: ramble-voice-${{ matrix.arch }}.flatpak
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-24.04
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Decode signing key
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties
      - name: Get dependencies
        run: flutter pub get
      - name: Build APK
        run: flutter build apk --release --target-platform android-arm64
      - name: Verify 16 KB alignment
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          bt=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -printf "%f\n" | sort -V | tail -n 1)
          echo "Using build-tools $bt"
          "$ANDROID_HOME/build-tools/$bt/zipalign" -c -P 16 -v 4 "$apk"
      - name: Name the asset
        run: |
          suffix=""
          if [ "$HAS_KEYSTORE" != "true" ]; then suffix="-debug-signed"; fi
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
            "dist/ramble-voice-arm64-v8a${suffix}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*.apk
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [flatpak, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '{flatpak-*,android-apk}'
          path: release
          merge-multiple: true
      - name: Checksums
        working-directory: release
        run: sha256sum -- *.flatpak *.apk > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.flatpak
            release/*.apk
            release/SHA256SUMS
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
