# `live` tests call real services or load a real model. They are skipped by
# default; run them with:
#   GEMINI_API_KEY=... tool/fl flutter test --run-skipped -t live test/live
tags:
  live:
    skip: "live test: run with --run-skipped -t live"
  # Offscreen screenshots of every screen (test/goldens). A plain run only
  # builds each screen; the PNGs are written with
  #   tool/fl flutter test --update-goldens test/goldens
  golden: {}
